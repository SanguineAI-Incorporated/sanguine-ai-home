<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Capabilities — Sanguine</title>

  <style>
    :root {
      --bg: #C8D8E4;
      --black: #000;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--black);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      text-align: center;
    }

    .wrap {
      max-width: 560px;
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.8s ease forwards;
    }

    .tagline {
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
      opacity: 0.8;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    a {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: underline;
      text-underline-offset: 3px;
      color: var(--black);
      opacity: 0.7;
      transition: opacity 0.15s ease;
    }

    a:hover {
      opacity: 1;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="tagline">
      Face ID for machines that see the world, not your data.
    </div>

    <p>stay tuned -- follow us on linkedin.</p>

    <a href="https://www.linkedin.com/company/sanguine-ai/" target="_blank" rel="noopener">
      linkedin
    </a>
  </div>

</body>
</html>
